<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenten-Netzwerk & Funk - Schmalkalden</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      --primary: #2563eb;
      --primary-light: #eff6ff;
      --success: #16a34a;
      --warning: #d97706;
      --bg-light: #f1f5f9;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --chat-bg: #f8fafc;
    }

    body.dark-mode {
      --primary: #ef4444;
      --primary-light: rgba(239, 68, 68, 0.15);
      --success: #22c55e;
      --warning: #f59e0b;
      --bg-light: #000000;
      --card-bg: #111111;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #222222;
      --chat-bg: #1a1a1a;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: var(--bg-light);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      transition: background 0.3s ease, color 0.3s ease;
      overflow: hidden;
    }

    .top-bar {
      width: 100%;
      height: 60px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      background: var(--card-bg);
      z-index: 1000;
    }

    .agent-title {
      font-size: 14px;
      font-weight: 700;
    }

    .top-right {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .timer {
      font-size: 12px;
      font-weight: bold;
      color: var(--primary);
      background: var(--primary-light);
      padding: 4px 10px;
      border-radius: 20px;
    }

    .btn-dark {
      background: none;
      border: 1px solid var(--border-color);
      border-radius: 50%;
      width: 36px;
      height: 36px;
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .main-view {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    #map {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }

    /* Floating Panel unten */
    .control-panel {
      position: absolute;
      bottom: 20px;
      left: 15px;
      right: 15px;
      background: var(--card-bg);
      padding: 16px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      z-index: 1000;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 500px;
      margin: 0 auto;
    }

    .status-msg {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      text-align: center;
    }

    /* Chat Bereich im Panel */
    .chat-box {
      background: var(--chat-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      height: 110px;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 12px;
    }

    .chat-msg {
      padding: 4px 8px;
      border-radius: 6px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      word-break: break-word;
    }

    .chat-input-row {
      display: flex;
      gap: 6px;
    }

    .chat-input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 13px;
      outline: none;
    }

    .btn-action {
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-success { background: var(--success); }

    body.dark-mode .leaflet-tile-container {
      filter: invert(90%) hue-rotate(180deg) brightness(95%) contrast(90%);
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="agent-title">🌐 Agenten-Funk Schmalkalden</div>
    <div class="top-right">
      <div class="timer">⏳ <span id="countdown">03:00:00</span></div>
      <button class="btn-dark" onclick="toggleDarkMode()">🌙</button>
    </div>
  </div>

  <!-- Map View -->
  <div class="main-view">
    <div id="map"></div>

    <div class="control-panel">
      <div id="statusStatus" class="status-msg">Tippe auf "GPS & Funk Starten", um loszulegen.</div>
      
      <!-- Chat Nachrichtenverlauf -->
      <div id="chatMessages" class="chat-box">
        <div class="chat-msg"><i>System: Agenten-Funk bereit.</i></div>
      </div>

      <!-- Eingabe für den Funk -->
      <div class="chat-input-row">
        <input type="text" id="chatInput" class="chat-input" placeholder="Nachricht an andere Agenten..." onkeypress="handleKey(event)">
        <button class="btn-action" onclick="sendChat()">Senden</button>
      </div>

      <button id="startBtn" class="btn-action btn-success" onclick="startSystem()">📡 GPS & Funk Starten</button>
      <button id="unlockBtn" class="btn-action" style="display:none;" onclick="unlockCodePrompt()">🔓 Code am Ziel eingeben</button>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- MQTT.js für Live-Kommunikation -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

  <script>
    const myRoute = [
      [50.719550, 10.464236], [50.720086, 10.464925], [50.720178, 10.464703],
      [50.720295, 10.464453], [50.720552, 10.464030], [50.720777, 10.463820],
      [50.721236, 10.463372], [50.721283, 10.462573], [50.721419, 10.461125],
      [50.721606, 10.459607], [50.721626, 10.459151], [50.721742, 10.458056],
      [50.721732, 10.457761], [50.721674, 10.457461], [50.721633, 10.457321],
      [50.721840, 10.457273], [50.722166, 10.457488], [50.722340, 10.458024],
      [50.722408, 10.458952], [50.722452, 10.459542], [50.722499, 10.459591],
      [50.722598, 10.459510], [50.722679, 10.458984], [50.723219, 10.456828],
      [50.723369, 10.456667], [50.723542, 10.456581], [50.723613, 10.456506],
      [50.723722, 10.456361], [50.723807, 10.456350], [50.723919, 10.456318],
      [50.723926, 10.456157], [50.723949, 10.456071], [50.724038, 10.456157],
      [50.724048, 10.455905], [50.724180, 10.455723], [50.724659, 10.454280],
      [50.724632, 10.453926], [50.724615, 10.453835], [50.725094, 10.452788],
      [50.725793, 10.451995], [50.726004, 10.451796], [50.726272, 10.451726],
      [50.726442, 10.451721], [50.726934, 10.451667], [50.727420, 10.451437],
      [50.727705, 10.451227], [50.727838, 10.451201], [50.728816, 10.451426],
      [50.729057, 10.451496], [50.729705, 10.450847], [50.730007, 10.450493],
      [50.730496, 10.449999], [50.730642, 10.449945], [50.730765, 10.449833],
      [50.730928, 10.449747], [50.731155, 10.449661], [50.731315, 10.449602],
      [50.731515, 10.449532], [50.731739, 10.449452], [50.731800, 10.449479],
      [50.731987, 10.449591], [50.732225, 10.449607], [50.732938, 10.449216],
      [50.733124, 10.449033], [50.733114, 10.448878], [50.733152, 10.448518],
      [50.733135, 10.448164], [50.732887, 10.447403], [50.732819, 10.447150],
      [50.732198, 10.445369], [50.731895, 10.444677], [50.731488, 10.444087],
      [50.731328, 10.443857], [50.731372, 10.443749], [50.731172, 10.443020],
      [50.731050, 10.442580], [50.730649, 10.440531], [50.730445, 10.439361],
      [50.730344, 10.439072], [50.731063, 10.437977], [50.731498, 10.436990],
      [50.731783, 10.436025], [50.731743, 10.434952], [50.731770, 10.433471]
    ];

    const TARGET_LAT = myRoute[myRoute.length - 1][0];
    const TARGET_LNG = myRoute[myRoute.length - 1][1];
    
    let map, myMarker;
    let agentId = 'Agent-' + Math.floor(Math.random() * 900 + 100);
    let mqttClient;

    function initMap() {
      map = L.map('map').setView(myRoute[0], 15);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
      L.polyline(myRoute, { color: '#2563eb', weight: 5, opacity: 0.8 }).addTo(map);
      L.marker([TARGET_LAT, TARGET_LNG]).addTo(map).bindPopup('<b>🎯 Ziel</b>');
    }

    function startSystem() {
      document.getElementById('startBtn').style.display = 'none';
      document.getElementById('statusStatus').innerText = "Verbinde mit Funk-Netzwerk...";

      // MQTT Verbindung für Echtzeit-Chat & Tracking
      mqttClient = mqtt.connect('wss://broker.hivemq.com:8884/mqtt');

      mqttClient.on('connect', function () {
        document.getElementById('statusStatus').innerText = `Verbunden als ${agentId}`;
        mqttClient.subscribe('schmalkalden/schnitzeljagd/funk');

        // GPS starten
        if (navigator.geolocation) {
          navigator.geolocation.watchPosition(updateGPS, () => {}, { enableHighAccuracy: true });
        }
      });

      mqttClient.on('message', function (topic, message) {
        try {
          const data = JSON.parse(message.toString());
          appendChatMessage(data.sender, data.text);
        } catch(e) {}
      });
    }

    function sendChat() {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text) return;

      if (mqttClient && mqttClient.connected) {
        const payload = JSON.stringify({ sender: agentId, text: text });
        mqttClient.publish('schmalkalden/schnitzeljagd/funk', payload);
        input.value = '';
      } else {
        alert("Funkverbindung noch nicht aktiv! Bitte erst auf Start tippen.");
      }
    }

    function handleKey(e) {
      if (e.key === 'Enter') sendChat();
    }

    function appendChatMessage(sender, text) {
      const box = document.getElementById('chatMessages');
      const div = document.createElement('div');
      div.className = 'chat-msg';
      div.innerHTML = `<b>${sender}:</b> ${text}`;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function updateGPS(position) {
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;

      if (!myMarker) {
        myMarker = L.marker([lat, lng]).addTo(map).bindPopup("Mein Standort").openPopup();
        map.setView([lat, lng], 17);
      } else {
        myMarker.setLatLng([lat, lng]);
      }

      const dist = getDistanceInMeters(lat, lng, TARGET_LAT, TARGET_LNG);
      document.getElementById('statusStatus').innerText = `Entfernung zum Ziel: ${Math.round(dist)}m`;

      if (dist <= 40) {
        document.getElementById('statusStatus').innerHTML = "🎯 <b>Ziel erreicht!</b>";
        document.getElementById('unlockBtn').style.display = "block";
      }
    }

    function getDistanceInMeters(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const φ1 = lat1 * Math.PI/180, φ2 = lat2 * Math.PI/180;
      const Δφ = (lat2-lat1) * Math.PI/180, Δλ = (lon2-lon1) * Math.PI/180;
      const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2) * Math.sin(Δλ/2);
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    function unlockCodePrompt() {
      const code = prompt("Gib den Code ein:");
      if (code && code.trim().toUpperCase() === "SCHLOSS2026") {
        confetti({ particleCount: 150, spread: 90, origin: { y: 0.6 } });
        alert("🎉 Mission erfolgreich abgeschlossen!");
      } else {
        alert("Falscher Code!");
      }
    }

    function toggleDarkMode() {
      document.body.classList.toggle('dark-mode');
    }

    var totalSeconds = 3 * 60 * 60;
    setInterval(() => {
      var h = Math.floor(totalSeconds / 3600), m = Math.floor((totalSeconds % 3600) / 60), s = totalSeconds % 60;
      document.getElementById("countdown").textContent = (h<10?"0"+h:h)+":"+(m<10?"0"+m:m)+":"+(s<10?"0"+s:s);
      if (totalSeconds > 0) totalSeconds--;
    }, 1000);

    window.onload = initMap;
  </script>
</body>
</html>
